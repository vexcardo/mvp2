.service-more-body strong { color: #5B4A6D; }
.service-price { font-size: 15px; font-weight: 600; color: #5B4A6D; margin-top: 2px; }
.btn-service { align-self: flex-start; background: #5B4A6D; color: white; border: none; border-radius: 10px; padding: 11px 20px; font-size: 14.5px; font-weight: 600; cursor: pointer; font-family: inherit; text-decoration: none; }
.btn-service:hover { background: #453856; }
